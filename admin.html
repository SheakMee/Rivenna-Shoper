<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rivenna | Yönetim Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#09070e;--panel:#15111d;--line:#30263c;--violet:#8d4dff;--text:#f7f2ff;--muted:#b4a9c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0910;background-image:radial-gradient(#241b32 1px,transparent 1px);background-size:22px 22px;color:var(--text);font-family:Manrope,Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);padding:32px;box-shadow:16px 18px 0 #03020566}.mark{font:800 26px Manrope;letter-spacing:-.08em}.mark i{font-style:normal;color:#a87cff}.eyebrow{color:#c8a8ff;font:11px 'DM Mono',monospace;letter-spacing:.12em;margin-top:26px}.box h1{font-size:29px;letter-spacing:-.06em;margin:12px 0}.box p{color:var(--muted);font-size:14px;line-height:1.6}.label{display:block;font:11px 'DM Mono',monospace;color:#cabbdf;margin:22px 0 7px}.input{width:100%;padding:13px;background:#0e0b14;border:1px solid #403050;color:#fff;font:14px Manrope;outline-color:var(--violet)}button{width:100%;margin-top:13px;padding:13px;border:0;background:var(--violet);color:#fff;font-weight:800;cursor:pointer}.error{min-height:18px;color:#ff9ab1;font-size:12px;margin-top:10px}.back{display:inline-block;margin-top:18px;color:#c8a8ff;font-size:12px;text-decoration:none}.note{font:11px 'DM Mono',monospace;color:#817491;margin-top:25px}.dashboard{display:none;min-height:100vh}.dashboard.show{display:grid;grid-template-columns:235px 1fr}.side{padding:28px 20px;border-right:1px solid var(--line);background:#0b0910}.side a{display:block;color:#b9adc9;text-decoration:none;padding:12px 10px;font-size:13px;border-left:2px solid transparent;transition:.18s}.side a:hover{color:#fff;background:#1b1426}.side a.active{color:#fff;background:#34224f;border-left-color:var(--violet);box-shadow:inset 20px 0 28px #8d4dff19}.main{padding:34px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:23px}.top h1{margin:0;font-size:28px;letter-spacing:-.06em}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}.logout{width:auto;margin:0;padding:10px 14px;background:#251839}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:28px}.card{background:var(--panel);border:1px solid var(--line);padding:20px}.card small{font:11px 'DM Mono',monospace;color:#bda8df}.card strong{display:block;font-size:29px;margin-top:12px;letter-spacing:-.05em}.card span{font-size:12px;color:#9385a7}.table{margin-top:20px;background:var(--panel);border:1px solid var(--line);padding:20px}.table h2{font-size:16px;margin:0 0 16px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;border-top:1px solid #2a2234;padding:14px 0;color:#b9adc9;font-size:13px}.row.head{padding-top:0;color:#8f7eaa;font:11px 'DM Mono',monospace;border:0}@media(max-width:700px){.dashboard.show{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.side a{display:inline-block}.main{padding:22px}.cards{grid-template-columns:1fr}.top{align-items:start;gap:10px;flex-direction:column}}
  </style>
</head>
<body>
  <section class="login" id="login"><div class="box"><div class="mark">RIV<i>E</i>NNA</div><div class="eyebrow">YÖNETİM ERİŞİMİ</div><h1>Yönetim paneli</h1><p>Bu alan yalnızca mağaza sahibi için tasarlanmıştır.</p><form id="form"><label class="label">YÖNETİCİ PAROLASI</label><input id="password" class="input" type="password" required autofocus placeholder="Parolanı gir"><button>Panele Giriş Yap</button><div class="error" id="error"></div></form><a class="back" href="./">← Mağazaya dön</a><div class="note">TASLAK GİRİŞ · SUNUCU TARAFI KORUMA YOK</div></div></section>
  <section class="dashboard" id="dashboard"><aside class="side"><div class="mark">RIV<i>E</i>NNA</div><div class="eyebrow">YÖNETİM</div><a class="active" data-panel="overview" href="#overview">Genel Bakış</a><a data-panel="orders" href="#orders">Siparişler</a><a data-panel="products" href="#products">Ürünler</a><a data-panel="customers" href="#customers">Müşteriler</a><a data-panel="balance" href="#balance">Bakiye İşlemleri</a></aside><main class="main" id="content"></main></section>
  <script>
    const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),form=document.querySelector('#form'),error=document.querySelector('#error');
    function show(){login.style.display='none';dash.classList.add('show')}if(sessionStorage.getItem('rivennaAdmin')==='ok')show();
    form.onsubmit=e=>{e.preventDefault();if(document.querySelector('#password').value==='5206'){sessionStorage.setItem('rivennaAdmin','ok');show()}else error.textContent='Parola doğru değil. Tekrar dene.'};
    const panels={
      overview:['Genel Bakış','Mağazanın mevcut durumunu buradan takip edebilirsin.','BUGÜNKÜ SİPARİŞLER|0|Henüz işlem yok','TOPLAM GELİR|₺0,00|Canlı ödeme bekleniyor','AKTİF MÜŞTERİ|0|Demo görünümü','Son hareketler','İŞLEM|DURUM|TUTAR','Gösterilecek işlem bulunmuyor|—|—'],
      orders:['Siparişler','Tüm siparişler burada listelenecek.','TOPLAM SİPARİŞ|0|Henüz sipariş yok','BEKLEYEN|0|İşlem beklemiyor','TAMAMLANAN|0|Teslim edilen sipariş yok','Sipariş listesi','SİPARİŞ|DURUM|TUTAR','Gösterilecek sipariş bulunmuyor|—|—'],
      products:['Ürünler','Katalogdaki ürünleri buradan takip edebilirsin.','AKTİF ÜRÜN|3|Katalogda yayında','TASLAK|0|Hazırlanıyor','STOK UYARISI|0|Dijital ürünlerde sınırsız','Ürün kataloğu','ÜRÜN|KATEGORİ|FİYAT','FocusFlow Pro|Üretkenlik|₺349'],
      customers:['Müşteriler','Hesap oluşturan müşteriler burada görünecek.','TOPLAM MÜŞTERİ|0|Demo görünümü','YENİ MÜŞTERİ|0|Bugün kayıt yok','AKTİF CÜZDAN|0|Bakiye işlemi yok','Müşteri listesi','MÜŞTERİ|E-POSTA|DURUM','Gösterilecek müşteri bulunmuyor|—|—'],
      balance:['Bakiye İşlemleri','Cüzdan hareketlerini buradan izleyebilirsin.','TOPLAM BAKİYE|₺0,00|Canlı ödeme bekleniyor','YÜKLEME|0|İşlem yok','İADE|0|İşlem yok','Bakiye hareketleri','İŞLEM|DURUM|TUTAR','Gösterilecek hareket bulunmuyor|—|—']
    };
    function showPanel(key){const p=[...panels[key]], count=localStorage.getItem('rivennaAccount')?1:0;if(key==='customers'){p[2]='TOPLAM MÜŞTERİ|'+count+'|Bu tarayıcıdaki kayıtlı hesap';p[3]='YENİ MÜŞTERİ|'+count+'|Yerel kayıt sayısı';p[4]='AKTİF CÜZDAN|'+count+'|Hesap durumu'}if(key==='overview')p[4]='AKTİF MÜŞTERİ|'+count+'|Yerel hesap sayısı';const [a,b,c,d,e,f,g,h]=p;const cards=[c,d,e].map(x=>{const [t,v,n]=x.split('|');return `<article class="card"><small>${t}</small><strong>${v}</strong><span>${n}</span></article>`}).join('');const head=g.split('|').map(x=>'<span>'+x+'</span>').join('');const row=h.split('|').map(x=>'<span>'+x+'</span>').join('');document.querySelector('#content').innerHTML=`<header class="top"><div><h1>${a}</h1><p>${b}</p></div><button class="logout" id="logout">Çıkış Yap</button></header><div class="cards">${cards}</div><section class="table"><h2>${f}</h2><div class="row head">${head}</div><div class="row">${row}</div></section>`;document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('rivennaAdmin');location.reload()};document.querySelectorAll('.side a').forEach(x=>x.classList.toggle('active',x.dataset.panel===key))}
    document.querySelectorAll('.side a').forEach(x=>x.onclick=e=>{e.preventDefault();showPanel(x.dataset.panel)});showPanel('overview');
    document.querySelector('.back').href='index.html';
  </script>
</body></html>
